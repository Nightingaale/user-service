server:
  port: 8083

springdoc:
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true